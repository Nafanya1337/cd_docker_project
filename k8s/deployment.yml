apiVersion: apps/v1
kind: Deployment
metadata:
  name: cd-docker-project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cd-docker-project
  template:
    metadata:
      labels:
        app: cd-docker-project
    spec:
      containers:
        - name: web
          image: nafanya13371337/cd-docker-project:latest
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
