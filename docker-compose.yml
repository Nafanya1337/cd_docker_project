services:
  web:
    image: ${DOCKER_IMAGE}
    container_name: cd-docker-project-web
    restart: always
    ports:
      - "127.0.0.1:8080:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
